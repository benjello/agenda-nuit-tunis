name: Synchro tickets

on:
  schedule:
    - cron: "30 6 * * 1"  # chaque lundi, vers 7h30 heure de Tunis
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

# Lecture seule : le script signale les écarts dans le résumé, il ne crée ni ne ferme rien.
permissions:
  contents: read
  issues: read

jobs:
  synchro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comparer BACKLOG.md et les issues ouvertes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scrapers.synchro_tickets
