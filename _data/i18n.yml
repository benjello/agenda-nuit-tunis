contrib.pr_texte: { ar: "تعرف GitHub؟ أضف المصدر مباشرة في السجل: افتح الملف، اضغط على القلم ✎، انسخ مدخلا مشابها، ثم «Propose changes». يتحقق منه آليا ثم يراجع قبل إضافته.", en: "Comfortable with GitHub? Add the source to the registry directly: open the file, click the pencil ✎, copy a similar entry, then « Propose changes ». It is checked automatically, then reviewed before being added." }
