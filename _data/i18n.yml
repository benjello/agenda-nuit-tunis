# À propos
apropos.titre: { ar: "حول الأجندا", en: "About" }
apropos.p1: { ar: "أغلب السهرات في تونس لا يعلن عنها إلا بملصق على إنستغرام أو في شباك تذاكر. تجمعها تونايت في مكان واحد، لكل الجماهير.", en: "Most nights out in Tunisia are only announced by a poster on Instagram or on a ticketing site. ToNight brings them together in one place, for every crowd." }
apropos.p2: { ar: "هي حاليا أجندا بين أصدقاء. الهدف أن تصبح موقعا عموميا حقيقيا.", en: "For now it is an agenda among friends. The goal is to make it a real public site." }
apropos.h_proposer: { ar: "اقترح مصدرا", en: "Suggest a source" }
apropos.p3: { ar: "تملأ الأجندا آليا من <a href=\"{base}sources/\">مصادر موثوقة</a>: مواقع فضاءات، مواقع تذاكر، مهرجانات. الأكثر إفادة أن تدلنا على <strong>موقع يعلن بانتظام عن أنشطة</strong>، بدل نشاط منفرد.", en: "The agenda fills itself from <a href=\"{base}sources/\">reliable sources</a>: venue sites, ticketing sites, festivals. The most useful thing is to point us to <strong>a site that regularly announces events</strong>, rather than a single event." }
apropos.p4: { ar: "لنشاط محدد، استعمل <a href=\"{base}proposer/\">استمارة « اقترح نشاطا »</a>. خطأ في صفحة؟ رابط « الإبلاغ عن خطأ » أسفل كل صفحة يفتح استمارة معبأة مسبقا. فضاء أو فنان أو محاضر ناقص، أو بطاقته غير مكتملة؟ <a href=\"{base}proposer/#fiche\">أعلمونا</a>.", en: "For a specific event, use the <a href=\"{base}proposer/\">“Suggest an event” form</a>. A mistake on a page? The “Report an error” link at the bottom of each page opens a pre-filled form. A venue, artist or speaker is missing, or their page is incomplete? <a href=\"{base}proposer/#fiche\">Tell us</a>." }
apropos.h_donnees: { ar: "البيانات المفتوحة", en: "Open data" }
apropos.p5: { ar: "كل ما في الأجندا قابل لإعادة الاستعمال بحرية:", en: "Everything in the agenda can be freely reused:" }
apropos.liste: { ar: "<li><strong>الرزنامة</strong>: اشترك في <a href=\"{base}agenda.ics\"><code>agenda.ics</code></a> في Google Agenda أو Apple Calendrier أو Outlook (« إضافة رزنامة عبر رابط »). تتحدث وحدها.</li><li><strong>واجهة برمجة</strong>: ملفات JSON مفتوحة (أنشطة، فضاءات، مصادر)، موثقة في صفحة <a href=\"{base}api/\">API</a>، لمواقعكم وبرامجكم وتطبيقاتكم.</li><li><strong>سجل المصادر</strong> و<strong>شفرة البرامج الآلية</strong>: على <a href=\"https://github.com/benjello/agenda-nuit-tunis\">مستودع GitHub</a>، لإعادة الاستعمال أو التحسين.</li>", en: "<li><strong>Calendar</strong>: subscribe to <a href=\"{base}agenda.ics\"><code>agenda.ics</code></a> in Google Calendar, Apple Calendar or Outlook (“add calendar by URL”). It updates itself.</li><li><strong>API</strong>: open JSON files (events, venues, sources), documented on the <a href=\"{base}api/\">API</a> page, for your sites, bots or apps.</li><li><strong>Source registry</strong> and <strong>scraper code</strong>: on the <a href=\"https://github.com/benjello/agenda-nuit-tunis\">GitHub repository</a>, to reuse or improve.</li>" }
apropos.p6: { ar: "تنشر البيانات برخصة <a href=\"https://creativecommons.org/licenses/by/4.0/deed.ar\">CC BY 4.0</a>: إعادة استعمال حرة، بما في ذلك التجارية، مع ذكر « Agenda culturel Tunis ». يحتفظ كل نشاط برابط مصدره الأصلي.", en: "The data is published under the <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a> licence: free reuse, including commercial, crediting “Agenda culturel Tunis”. Each event keeps the link to its original source." }
sante.controle: { ar: "بعد كل مرور، يعيد فحص قراءة كل الأنشطة. يصحح وحده الأماكن التي هي في الحقيقة اسم مصدر (جريدة، أجندا، مجموعة).", en: "After each run, a check rereads every event. It fixes by itself the venues that are really the name of a source (newspaper, agenda, collective)." }
sante.corriges: { ar: "صححت في المرور الأخير.", en: "fixed on the last run." }
sante.signale: { ar: "ويشير هنا إلى الباقي: عنوان مبهم أو طويل جدا، تاريخ بعيد، نفس النشاط مرتين.", en: "It lists the rest here: vague or overly long title, far-off date, same event twice." }
