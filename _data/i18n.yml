sante.granularite: { ar: "الدقة حسب نوع المصدر", en: "Precision by type of source" }
sante.granularite_intro: { ar: "يكون المدخل دقيقا عندما يكون نشاطا مسمى (فيلم بعروضه، معرض بتواريخه)، برابط إلى صفحته الخاصة وفضاء معروف. يبين هذا الجدول، لكل طريقة قراءة، نسبة المداخل الدقيقة وما ينقصها: هناك يجب تحسين أداة القراءة.", en: "An entry is precise when it is a named event (a film with its showtimes, an exhibition with its dates), with a link to its own page and a known venue. This table shows, for each way of reading sources, the share of precise entries and what is missing: that is where the scraper needs work." }
