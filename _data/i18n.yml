contrib.intro: { ar: "فضاءات كثيرة لا تعلن عن مواعيدها إلا على فيسبوك أو إنستغرام، ولا نعرف دائما صفحتها. تعرفها؟ أعطنا العنوان وستقرؤها الأجندا كل يوم.", en: "Many venues only announce their dates on Facebook or Instagram, and we don't always know their page. Do you? Give us the address and the agenda will read it every day." }
