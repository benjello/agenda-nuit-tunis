couv_titre: { ar: "تغطية الأجندا", en: "Agenda coverage" }
couv_intro: { ar: "حصيلة تحدث كل يوم، سطر لكل أسبوع. نحسب أنشطة الأيام السبعة القادمة دون تكرار. يحسب الفيلم مرة واحدة مهما كان عدد القاعات. انظر أيضا <a href=\"{base}sante/\">حالة المصادر</a>.", en: "Updated every day, one line per week. We count the events of the next 7 days, without duplicates. A film counts once, whatever the number of cinemas. See also the <a href=\"{base}sante/\">source health</a>." }
