sante_titre: { ar: "حالة المصادر", en: "Source health" }
sante_intro: { ar: "يعاد قراءة كل مصدر آليا. هنا نرى المصادر التي تعمل، والتي لم تعلن شيئا منذ مدة (فضاء مغلق، حساب تغير؟) والمعطلة أو المتوقفة. كل مساعدة لإصلاح مصدر مرحب بها.", en: "Each source is reread automatically. Here you see the ones that work, the ones that have announced nothing for a long time (venue closed, account changed?) and the ones that are broken or paused. Any help fixing a source is welcome." }
