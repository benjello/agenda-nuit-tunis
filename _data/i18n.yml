sources_titre: { ar: "مصادرنا", en: "Our sources" }
sources_intro: { ar: "تعيد الأجندا قراءة هذه المواقع كل يوم، حيث تعلن الفضاءات ومواقع التذاكر برامجها. كل نشاط يحيل إلى مصدره.", en: "Every day the agenda rereads these sites, where venues and ticketing sites announce their programmes. Each event links to its source." }
