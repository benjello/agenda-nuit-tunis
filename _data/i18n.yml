sante_note: { ar: "« صامت »: يقرأ المصدر جيدا لكنه لم يعلن شيئا منذ أكثر من 30 يوما. المصادر المتوقفة معروفة لكنها لم توصل بعد، أو عنوانها يحتاج تثبتا (انظر <code>_data/sources.yml</code>).", en: "“Silent”: the source reads fine but has announced nothing for more than 30 days. Paused sources are known but not connected yet, or their address needs checking (see <code>_data/sources.yml</code>)." }
